version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: whatsapp_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

  mysql:
    image: mysql:8.0
    container_name: whatsapp_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-chatbot_monitor}
      MYSQL_USER: ${DB_USER:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: whatsapp_backend
    depends_on:
      - redis
      - mysql
    restart: unless-stopped
    volumes:
      - ./backend:/app/backend
      - ./database:/app/database
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: whatsapp_worker
    depends_on:
      - redis
      - backend
    restart: unless-stopped
    volumes:
      - ./backend:/app/backend
      - ./automation:/app/automation
      - ./screenshots:/app/screenshots
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: whatsapp_frontend
    ports:
      - "127.0.0.1:8085:80"
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  redis_data:
  mysql_data:
