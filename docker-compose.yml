version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: whatsapp_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: whatsapp_backend
    depends_on:
      - redis
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - ./database:/app/database
    environment:
      - REDIS_URL=redis://redis:6379/0

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: whatsapp_worker
    depends_on:
      - redis
      - backend
    restart: unless-stopped
    volumes:
      - ./backend:/app/backend
      - ./automation:/app/automation
      - ./screenshots:/app/screenshots
    environment:
      - REDIS_URL=redis://redis:6379/0

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: whatsapp_frontend
    ports:
      - "8085:80"
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  redis_data:
