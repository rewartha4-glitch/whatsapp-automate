version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: whatsapp_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

  mysql:
    image: mysql:8.0
    container_name: whatsapp_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-chatbot_monitor}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-root}"]
      timeout: 10s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: whatsapp_backend
    depends_on:
      redis:
        condition: service_started
      mysql:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./backend:/app/backend
      - ./database:/app/database
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: whatsapp_worker
    depends_on:
      redis:
        condition: service_started
      backend:
        condition: service_started
      mysql:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./backend:/app/backend
      - ./automation:/app/automation
      - ./screenshots:/app/screenshots
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: whatsapp_frontend
    ports:
      - "127.0.0.1:8085:80"
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  redis_data:
  mysql_data:
